<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Feedback That Teaches</title>
<desc>The question &quot;Which describes infiltration?&quot; and the learner&#x27;s choice, B, water flowing over the ground. Four messages in order of helpfulness. &quot;Wrong.&quot; says the answer failed, explains nothing, points nowhere, and does not blame; the learner is puzzled; weak. &quot;Good try!&quot; does not say whether the answer was right, explains nothing, points nowhere, and does not blame; the learner is still puzzled; weak. &quot;Incorrect. The answer is A.&quot; says the answer was wrong and gives the answer but no reason; weak. &quot;Not quite. Water flowing over the ground is runoff. Infiltration is water soaking into the ground, so the answer is A.&quot; says it was wrong, explains why, points toward the right idea, and does not blame; the learner understands; strong.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Feedback That Teaches</text>
<text x="40" y="80" font-size="18" fill="#4a5666">One wrong answer, four messages, from least to most helpful.</text>
<rect x="30" y="98" width="1140" height="62" rx="12" fill="#ffffff" stroke="#c9d1db" stroke-width="2.5"/>
<text x="46" y="125" font-size="20" fill="#1b2a41" font-weight="bold">Question: &quot;Which describes infiltration?&quot;</text>
<text x="46" y="150" font-size="17" fill="#1b2a41">The learner chose B: &quot;Water flowing over the ground.&quot; The right answer is A: &quot;Water soaking into the ground.&quot;</text>
