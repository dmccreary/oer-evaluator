<title>Component in a Box</title>
<desc>An exploded view. A cardboard box labelled with a folder shape; six parts float above it with dotted lines into the box: a page (index.html), a script (quiz.js) that stays inside the folder, a README, a license file, a metadata file, and an image folder (img). Outside the box, a dotted line runs from the page to a separate folder far away with a cross on it, showing the broken link that packaging prevents. At the lower right, three finished boxes stand for the reading, the quiz, and the simulation of Watershed Basics v1.1.</desc>
