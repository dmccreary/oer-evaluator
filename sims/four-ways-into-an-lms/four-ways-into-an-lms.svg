<text x="744.2" y="324.8" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">One-way</text>
<text x="623" y="366" font-size="12" fill="#8a5a00" font-weight="bold" letter-spacing="1">WHAT IT DOES</text>
<text x="623" y="390" font-size="17" fill="#1b2a41" font-weight="bold">A whole unit is copied into</text>
<text x="623" y="410.7" font-size="17" fill="#1b2a41" font-weight="bold">the LMS as a package.</text>
<text x="623" y="443.5" font-size="12" fill="#8a5a00" font-weight="bold" letter-spacing="1">WHAT STAYS</text>
<text x="623" y="467.5" font-size="16" fill="#1b2a41">A single compressed file with a</text>
<text x="623" y="487" font-size="16" fill="#1b2a41">manifest.</text>
<text x="623" y="518.5" font-size="12" fill="#8a5a00" font-weight="bold" letter-spacing="1">WHAT IT NEEDS</text>
<text x="623" y="542.5" font-size="16" fill="#1b2a41">The common exchange form</text>
<text x="623" y="562" font-size="16" fill="#1b2a41">between LMSs. Not every</text>
<text x="623" y="581.6" font-size="16" fill="#1b2a41">resource offers one.</text>
