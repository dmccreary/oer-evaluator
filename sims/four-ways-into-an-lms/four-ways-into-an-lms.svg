<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Link, Embed, Import, or LTI: Four Ways Into an LMS</title>
<desc>Four zones, each showing a resource and a generic learning management system. Link: students open the resource at its own address; one arrow runs from the course page to the resource, which stays on its own host. Embed: the resource appears on the course page through a frame; the arrow runs from the resource into the page; it needs a host that allows framing. Common Cartridge import: a whole unit is copied into the LMS as one compressed file with a manifest; one arrow into the LMS. LTI tool: an external tool opens inside the LMS and can send results back to the gradebook; a two-way arrow and a shield for learner privacy; the tool runs on another company&#x27;s server. A footer says platform lock-in stops all four.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Link, Embed, Import, or LTI: Four Ways Into an LMS</text>
<text x="40" y="80" font-size="18" fill="#4a5666">The same resource, the same generic LMS, four ways in. The arrows show which way information flows.</text>
