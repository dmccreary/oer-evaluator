<circle cx="62" cy="657.6" r="1.9" fill="#ffffff"/>
<text x="92" y="658" font-size="18" fill="#1b2a41" font-weight="bold">Platform lock-in is the barrier that stops all four: leaving a platform should not cost you the resource.</text>
</svg>
