<path d="M1028.8,198 L1032.1,201.6 L1037.3,195.1" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="991.4" y="308" width="82.8" height="24" rx="12" fill="#573379"/>
<text x="1032.8" y="324.8" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">Two-way</text>
<text x="911.5" y="366" font-size="12" fill="#573379" font-weight="bold" letter-spacing="1">WHAT IT DOES</text>
<text x="911.5" y="390" font-size="17" fill="#1b2a41" font-weight="bold">An external tool opens</text>
<text x="911.5" y="410.7" font-size="17" fill="#1b2a41" font-weight="bold">inside the LMS and can</text>
<text x="911.5" y="431.5" font-size="17" fill="#1b2a41" font-weight="bold">send results back.</text>
<text x="911.5" y="464.2" font-size="12" fill="#573379" font-weight="bold" letter-spacing="1">WHAT STAYS</text>
<text x="911.5" y="488.2" font-size="16" fill="#1b2a41">It runs on another company&#x27;s</text>
<text x="911.5" y="507.7" font-size="16" fill="#1b2a41">server.</text>
<text x="911.5" y="539.3" font-size="12" fill="#573379" font-weight="bold" letter-spacing="1">WHAT IT NEEDS</text>
<text x="911.5" y="563.3" font-size="16" fill="#1b2a41">Passes learner information,</text>
<text x="911.5" y="582.8" font-size="16" fill="#1b2a41">which raises the privacy</text>
<text x="911.5" y="602.3" font-size="16" fill="#1b2a41">questions of Chapter 13.</text>
<rect x="30" y="626" width="1140" height="52" rx="12" fill="#eef1f5" stroke="#6b7785" stroke-width="2.5"/>
