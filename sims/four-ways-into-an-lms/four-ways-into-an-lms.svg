<rect x="64" y="194" width="76" height="14" rx="7" fill="#ffffff" stroke="#1d4f86" stroke-width="2"/>
<line x1="232.5" y1="268" x2="159.5" y2="255.6" stroke="#1d4f86" stroke-width="4" stroke-linecap="butt"/>
<polygon points="150,254 161.2,249.8 159.2,261.7" fill="#1d4f86" stroke-linejoin="miter"/>
<rect x="126.2" y="308" width="82" height="24" rx="12" fill="#1d4f86"/>
<text x="167.2" y="324.8" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">One-way</text>
<text x="46" y="366" font-size="12" fill="#1d4f86" font-weight="bold" letter-spacing="1">WHAT IT DOES</text>
<text x="46" y="390" font-size="17" fill="#1b2a41" font-weight="bold">Students open the resource</text>
<text x="46" y="410.7" font-size="17" fill="#1b2a41" font-weight="bold">at its own address.</text>
<text x="46" y="443.5" font-size="12" fill="#1d4f86" font-weight="bold" letter-spacing="1">WHAT STAYS</text>
<text x="46" y="467.5" font-size="16" fill="#1b2a41">The resource stays on its own</text>
<text x="46" y="487" font-size="16" fill="#1b2a41">host.</text>
<text x="46" y="518.5" font-size="12" fill="#1d4f86" font-weight="bold" letter-spacing="1">WHAT IT NEEDS</text>
<text x="46" y="542.5" font-size="16" fill="#1b2a41">Needs a good link: permanent,</text>
<text x="46" y="562" font-size="16" fill="#1b2a41">direct, and working for the</text>
<text x="46" y="581.6" font-size="16" fill="#1b2a41">person who receives it.</text>
<rect x="318.5" y="108" width="274.5" height="504" rx="14" fill="#ffffff" stroke="#00796b" stroke-width="3"/>
