<rect x="414.7" y="308" width="82" height="24" rx="12" fill="#00796b"/>
<text x="455.8" y="324.8" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">One-way</text>
<text x="334.5" y="366" font-size="12" fill="#00796b" font-weight="bold" letter-spacing="1">WHAT IT DOES</text>
<text x="334.5" y="390" font-size="17" fill="#1b2a41" font-weight="bold">The resource appears on</text>
<text x="334.5" y="410.7" font-size="17" fill="#1b2a41" font-weight="bold">your course page through a</text>
<text x="334.5" y="431.5" font-size="17" fill="#1b2a41" font-weight="bold">frame.</text>
<text x="334.5" y="464.2" font-size="12" fill="#00796b" font-weight="bold" letter-spacing="1">WHAT STAYS</text>
<text x="334.5" y="488.2" font-size="16" fill="#1b2a41">The page shows it without</text>
<text x="334.5" y="507.7" font-size="16" fill="#1b2a41">leaving your course.</text>
<text x="334.5" y="539.3" font-size="12" fill="#00796b" font-weight="bold" letter-spacing="1">WHAT IT NEEDS</text>
<text x="334.5" y="563.3" font-size="16" fill="#1b2a41">Needs a host that allows</text>
<text x="334.5" y="582.8" font-size="16" fill="#1b2a41">framing, and no login.</text>
