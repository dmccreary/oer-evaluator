<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>How Fast Does Content Spoil?</title>
<desc>Three shelves of a market stall, from slow to fast. Slow shelf: basic mathematics and definitions, which age very slowly, checked at each major review; and the sequence of historical events, which ages slowly, checked at each major review. Middle shelf: statistics and survey results, which age moderately, checked every few years or whenever new data appear; and standards, curricula, and guidelines, which age moderately, checked every few years and when a standard is revised. Fast shelf: software screenshots, prices, and web addresses, and laws, policies, and contact details, which age quickly, checked every year or more often.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">How Fast Does Content Spoil?</text>
<text x="40" y="80" font-size="18" fill="#4a5666">Match the amount of checking to how fast the topic moves. Six kinds of content, three shelves.</text>
