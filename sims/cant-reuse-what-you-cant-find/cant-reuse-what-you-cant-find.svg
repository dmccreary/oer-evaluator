<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>You Can&#x27;t Reuse What You Can&#x27;t Find</title>
<desc>A generic search page with the query &quot;watershed grade 6 reading open license&quot; and three result cards, each with six fields: title, author, subject, grade level, license, and description. Resource A is complete: title Watershed Basics, author Maria Lopez, subject Earth science, grade 6 to 7, license CC BY 4.0, and a clear description. The search finds it and it ranks high. Resource B has only the title &quot;Reading 4&quot;; the other five fields are dashed placeholders, and no field mentions a watershed, so it is not found. Resource C has the title Watershed Basics and an author, but no subject, grade level, license, or description. It is possibly found, but the teacher cannot tell the grade or whether she may reuse it.</desc>
