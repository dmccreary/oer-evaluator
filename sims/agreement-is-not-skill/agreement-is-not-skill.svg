<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Agreement Is Not Skill</title>
<desc>Three panels. Panel 1, the count table for 20 resources: agent ready and human ready, 1; agent ready and human not ready, 1; agent not ready and human ready, 1; agent not ready and human not ready, 17. The two agreements, 1 and 17, are highlighted, so they agree on 18 of 20, which is 0.90. Panel 2, chance agreement: a bar from 0 to 1 shows 0.01 from both saying ready plus 0.81 from both saying not ready, which is 0.82, so most of the 0.90 is expected by luck; only 0.08 is beyond chance. Panel 3: kappa equals (0.90 minus 0.82) divided by (1 minus 0.82), which is 0.08 divided by 0.18, about 0.44. The agent found only one of the two resources the human judged ready.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Agreement Is Not Skill</text>
<text x="40" y="80" font-size="18" fill="#4a5666">20 resources, one question: is each one ready to adopt? An agent and a human answer.</text>
<rect x="30" y="106" width="380" height="534" rx="14" fill="#ffffff" stroke="#1d4f86" stroke-width="3"/>
<rect x="30" y="106" width="380" height="46" rx="14" fill="#1d4f86"/>
<rect x="30" y="130" width="380" height="22" rx="0" fill="#1d4f86"/>
<text x="46" y="137" font-size="21" fill="#ffffff" font-weight="bold">1  Count the agreements</text>
<text x="264" y="178" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">Human</text>
<text x="202" y="210" font-size="16" fill="#1b2a41" font-weight="bold" text-anchor="middle">ready</text>
<text x="326" y="210" font-size="16" fill="#1b2a41" font-weight="bold" text-anchor="middle">not ready</text>
<text x="86" y="308" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">Agent</text>
<text x="130" y="275" font-size="16" fill="#1b2a41" font-weight="bold" text-anchor="end">ready</text>
<text x="130" y="353" font-size="16" fill="#1b2a41" font-weight="bold" text-anchor="end">not ready</text>
<rect x="140" y="230" width="124" height="78" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="4"/>
<text x="202" y="284" font-size="42" fill="#1b5e20" font-weight="bold" text-anchor="middle">1</text>
<rect x="264" y="230" width="124" height="78" rx="6" fill="#f3f4f6" stroke="#c9d1db" stroke-width="2"/>
<text x="326" y="284" font-size="42" fill="#1b2a41" font-weight="bold" text-anchor="middle">1</text>
<rect x="140" y="308" width="124" height="78" rx="6" fill="#f3f4f6" stroke="#c9d1db" stroke-width="2"/>
<text x="202" y="362" font-size="42" fill="#1b2a41" font-weight="bold" text-anchor="middle">1</text>
<rect x="264" y="308" width="124" height="78" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="4"/>
<text x="326" y="362" font-size="42" fill="#1b5e20" font-weight="bold" text-anchor="middle">17</text>
<text x="220" y="430" font-size="20" fill="#1b5e20" font-weight="bold" text-anchor="middle">Agree on 1 + 17 = 18 of 20</text>
<text x="220" y="468" font-size="22" fill="#1b2a41" font-weight="bold" text-anchor="middle">observed agreement  po = 0.90</text>
<text x="220" y="506" font-size="16" fill="#4a5666" text-anchor="middle">The green diagonal holds the agreements.</text>
<text x="220" y="526" font-size="16" fill="#4a5666" text-anchor="middle">Always show this table beside kappa.</text>
<rect x="424" y="106" width="380" height="534" rx="14" fill="#ffffff" stroke="#8a5a00" stroke-width="3"/>
<rect x="424" y="106" width="380" height="46" rx="14" fill="#8a5a00"/>
<rect x="424" y="130" width="380" height="22" rx="0" fill="#8a5a00"/>
<text x="440" y="137" font-size="21" fill="#ffffff" font-weight="bold">2  Subtract what luck gives</text>
<defs><pattern id="chance" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fdf1d6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c9a45f" stroke-width="3"/></pattern></defs>
<rect x="454" y="256" width="320" height="64" rx="0" fill="#f3f4f6" stroke="#1b2a41" stroke-width="2.5"/>
<rect x="454" y="256" width="262.4" height="64" rx="0" fill="url(#chance)" stroke="#1b2a41" stroke-width="2.5"/>
<rect x="457.2" y="256" width="259.2" height="64" rx="0" fill="none"/>
<rect x="716.4" y="256" width="25.6" height="64" rx="0" fill="#2e7d32" stroke="#1b2a41" stroke-width="2.5"/>
<rect x="742" y="256" width="32" height="64" rx="0" fill="#e57373" stroke="#1b2a41" stroke-width="2.5"/>
<line x1="716.4" y1="234" x2="716.4" y2="330" stroke="#1b2a41" stroke-width="2.5" stroke-linecap="round"/>
<line x1="742" y1="208" x2="742" y2="330" stroke="#1b2a41" stroke-width="2.5" stroke-linecap="round"/>
<text x="710.4" y="246" font-size="17" fill="#5c3c00" font-weight="bold" text-anchor="end">pe = 0.82</text>
<text x="774" y="202" font-size="17" fill="#1b5e20" font-weight="bold" text-anchor="end">po = 0.90</text>
<text x="454" y="348" font-size="15" fill="#4a5666" text-anchor="middle">0</text>
<text x="774" y="348" font-size="15" fill="#4a5666" text-anchor="middle">1</text>
<rect x="454" y="378" width="22" height="22" rx="0" fill="url(#chance)" stroke="#1b2a41" stroke-width="2"/>
<text x="486" y="395" font-size="14.5" fill="#1b2a41">expected by chance: 0.01 + 0.81 = 0.82</text>
<rect x="454" y="408" width="22" height="22" rx="0" fill="#2e7d32" stroke="#1b2a41" stroke-width="2"/>
<text x="486" y="425" font-size="16.5" fill="#1b2a41">beyond chance: 0.90 − 0.82 = 0.08</text>
<rect x="454" y="438" width="22" height="22" rx="0" fill="#e57373" stroke="#1b2a41" stroke-width="2"/>
<text x="486" y="455" font-size="16.5" fill="#1b2a41">disagreements: 0.10</text>
<text x="614" y="516" font-size="16" fill="#1b2a41" font-weight="bold" text-anchor="middle">Both say ready: 0.10 × 0.10 = 0.01. Both</text>
<text x="614" y="536" font-size="16" fill="#1b2a41" font-weight="bold" text-anchor="middle">say not ready: 0.90 × 0.90 = 0.81. Most of</text>
<text x="614" y="556" font-size="16" fill="#1b2a41" font-weight="bold" text-anchor="middle">the 90 percent is not skill.</text>
<rect x="818" y="106" width="352" height="534" rx="14" fill="#ffffff" stroke="#573379" stroke-width="3"/>
<rect x="818" y="106" width="352" height="46" rx="14" fill="#573379"/>
<rect x="818" y="130" width="352" height="22" rx="0" fill="#573379"/>
<text x="834" y="137" font-size="21" fill="#ffffff" font-weight="bold">3  Kappa</text>
<text x="994" y="198" font-size="29.5" fill="#1b2a41" font-weight="bold" text-anchor="middle">κ = (po − pe) / (1 − pe)</text>
<text x="994" y="248" font-size="24" fill="#1b2a41" text-anchor="middle">= (0.90 − 0.82) / (1 − 0.82)</text>
<text x="994" y="290" font-size="24" fill="#1b2a41" text-anchor="middle">= 0.08 / 0.18</text>
<rect x="868" y="316" width="252" height="92" rx="14" fill="#efe6f6" stroke="#573379" stroke-width="3"/>
<text x="994" y="381" font-size="62" fill="#573379" font-weight="bold" text-anchor="middle">0.44</text>
<text x="994" y="444" font-size="15.5" fill="#1b2a41" font-weight="bold" text-anchor="middle">90 percent agreement sounds excellent.</text>
<text x="994" y="468" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">Kappa tells a more honest story.</text>
<polygon points="864,510 885,546 843,546" fill="#e69500" stroke-linejoin="round"/>
<line x1="864" y1="524" x2="864" y2="535" stroke="#1b2a41" stroke-width="4" stroke-linecap="round"/>
<circle cx="864" cy="541" r="2.8" fill="#1b2a41"/>
<text x="896" y="526" font-size="17" fill="#1b2a41" font-weight="bold">The agent found only one of</text>
<text x="896" y="547.2" font-size="17" fill="#1b2a41" font-weight="bold">the two resources the</text>
<text x="896" y="568.5" font-size="17" fill="#1b2a41" font-weight="bold">human judged ready.</text>
<text x="40" y="672" font-size="14" fill="#4a5666">Worked example from Chapter 14, rounded to two decimal places. Kappa cutoffs are rules of thumb: check them against the source before quoting them.</text>
</svg>
