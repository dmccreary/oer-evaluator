<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Reliability and Validity Targets Poster MicroSim using SVG and JavaScript</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: black; background: aliceblue; }
        main { height: 100%; box-sizing: border-box; padding: 8px 12px 6px 12px; display: flex; flex-direction: column; gap: 8px; }
        #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        button { font: inherit; padding: 5px 14px; color: black; background: white; border: 2px solid dimgray; border-radius: 8px; cursor: pointer; }
        button:hover:not(:disabled) { background: lightcyan; border-color: navy; }
        button.on, #btn-next, #btn-again { color: white; background: navy; border-color: navy; font-weight: bold; }
        button:disabled { color: white; background: lightsteelblue; border-color: lightsteelblue; cursor: default; }
        button:focus-visible, .zone:focus-visible { outline: 3px solid black; outline-offset: 2px; }
        button[hidden] { display: none; }
        #progress { display: inline-flex; gap: 3px; margin-left: auto; }
        .seg { width: 20px; height: 16px; border: 1px solid silver; border-radius: 3px; background: gainsboro; }
        .seg.ok { background: seagreen; }
        .seg.miss { background: firebrick; }
        .seg.cur { border: 2px solid black; }
        #stage { flex: 0 1 auto; min-height: 0; display: flex; justify-content: center; }
        #poster { width: 100%; height: auto; max-height: 54vh; background: white; border: 1px solid silver; border-radius: 10px; }
        #panel { flex: 1 1 auto; min-height: 0; overflow: auto; background: white; border: 2px solid slategray; border-radius: 10px; padding: 4px 12px 8px 12px; line-height: 1.3; }
        #panel h2 { margin: 6px 0 2px 0; font-size: 20px; }
        #panel h2.pass { color: darkgreen; }
        #panel p { margin: 4px 0; }
        #panel ul { margin: 2px 0 2px 0; padding-left: 22px; }
        #panel .prompt { color: dimgray; }
        #panel .tip { color: dimgray; font-style: italic; }
        #panel .qhead { font-weight: bold; color: dimgray; margin-bottom: 0; }
        #panel .question { font-size: 18px; }
        #panel .feedback { padding: 6px 10px; border-radius: 8px; border: 3px solid; }
        #panel .feedback.good { color: darkgreen; background: honeydew; border-color: seagreen; }
        #panel .feedback.bad { color: firebrick; background: mistyrose; border-color: firebrick; }
        #panel .feedback.hint { color: saddlebrown; background: lemonchiffon; border-color: darkgoldenrod; }
        #actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 36px; }
        #actions a { margin-left: auto; font-size: 14px; }
        .zone { cursor: pointer; outline: none; }
        .zone .region { fill: rgba(255, 215, 0, 0.25); stroke: darkorange; stroke-width: 4; opacity: 0; pointer-events: none; }
        .zone:hover .region, .zone.active .region, .zone:focus-visible .region { opacity: 1; }
        .zone.correct .region { opacity: 1; fill: rgba(46, 139, 87, 0.25); stroke: seagreen; }
        .zone.wrong .region { opacity: 1; fill: rgba(178, 34, 34, 0.2); stroke: firebrick; }
        .marker circle { fill: navy; stroke: white; stroke-width: 3; }
        .marker text { fill: white; font: bold 19px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
        .zone:hover .marker circle, .zone.active .marker circle, .zone:focus-visible .marker circle { fill: darkorange; }
        .zone.correct .marker circle { fill: seagreen; }
        .zone.wrong .marker circle { fill: firebrick; }
        .ptitle { font: bold 30px Arial, Helvetica, sans-serif; fill: #1b2a41; pointer-events: none; }
        .ttitle { font: bold 24px Arial, Helvetica, sans-serif; fill: #1b2a41; text-anchor: middle; pointer-events: none; }
    </style>
</head>
<body>
    <main>
        <div id="bar">
            <button id="btn-explore" class="on" aria-pressed="true">Explore</button>
            <button id="btn-quiz" aria-pressed="false">Quiz me</button>
            <span id="progress" aria-hidden="true"></span>
        </div>
        <div id="stage">
<svg id="poster" viewBox="0 0 900 560" role="group" aria-label="Poster with four archery targets in two rows of two. Each target shows a bullseye and six shots: tightly grouped on the bullseye, tightly grouped away from it, widely spread around it, and widely spread mostly to one side." xmlns="http://www.w3.org/2000/svg">
<g class="zone" data-zone="reliable-valid">

  <text class="ttitle" x="230" y="51">Reliable and valid</text>
  <circle cx="230" cy="163" r="92" fill="#ffffff" stroke="#555" stroke-width="2"/>

  <circle cx="230" cy="163" r="4" fill="#555"/>
  <circle cx="222" cy="158" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="236" cy="154" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="240" cy="167" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="226" cy="172" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="232" cy="161" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="219" cy="166" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <rect class="region" x="11" y="11" width="438" height="258" rx="19"/>
</g>
<g class="zone" data-zone="reliable-not-valid">
  <rect x="455" y="15" width="430" height="250" rx="16" fill="#e6f0ff" stroke="#6b8fc7" stroke-width="3"/>
  <text class="ttitle" x="670" y="51">Reliable but not valid</text>
  <circle cx="670" cy="163" r="92" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="163" r="74" fill="#d6e6f7" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="163" r="56" fill="#9cc3ea" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="163" r="38" fill="#f2b3b3" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="163" r="20" fill="#f6c945" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="163" r="4" fill="#555"/>
  <circle cx="705" cy="118" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="716" cy="128" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="710" cy="131" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="720" cy="121" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="714" cy="117" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="707" cy="126" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <rect class="region" x="451" y="11" width="438" height="258" rx="19"/>
</g>
<g class="zone" data-zone="valid-not-reliable">
  <rect x="15" y="280" width="430" height="250" rx="16" fill="#fff3e0" stroke="#d19a3e" stroke-width="3"/>
  <text class="ttitle" x="230" y="316">Valid on average but not reliable</text>
  <circle cx="230" cy="428" r="92" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <circle cx="230" cy="428" r="74" fill="#d6e6f7" stroke="#555" stroke-width="2"/>
  <circle cx="230" cy="428" r="56" fill="#9cc3ea" stroke="#555" stroke-width="2"/>
  <circle cx="230" cy="428" r="38" fill="#f2b3b3" stroke="#555" stroke-width="2"/>
  <circle cx="230" cy="428" r="20" fill="#f6c945" stroke="#555" stroke-width="2"/>
  <circle cx="230" cy="428" r="4" fill="#555"/>
  <circle cx="175" cy="398" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="278" cy="376" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="290" cy="453" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="195" cy="478" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="235" cy="366" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="168" cy="443" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <rect class="region" x="11" y="276" width="438" height="258" rx="19"/>
</g>
<g class="zone" data-zone="neither">
  <rect x="455" y="280" width="430" height="250" rx="16" fill="#ffe8e8" stroke="#c76a6a" stroke-width="3"/>
  <text class="ttitle" x="670" y="316">Neither reliable nor valid</text>
  <circle cx="670" cy="428" r="92" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="428" r="74" fill="#d6e6f7" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="428" r="56" fill="#9cc3ea" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="428" r="38" fill="#f2b3b3" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="428" r="20" fill="#f6c945" stroke="#555" stroke-width="2"/>
  <circle cx="670" cy="428" r="4" fill="#555"/>
  <circle cx="605" cy="463" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="630" cy="488" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="600" cy="418" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="645" cy="453" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="680" cy="378" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="615" cy="483" r="7" fill="#c0392b" stroke="white" stroke-width="2"/>
  <rect class="region" x="451" y="276" width="438" height="258" rx="19"/>
</g>
</svg>
        </div>
        <section id="panel" aria-live="polite"></section>
        <div id="actions">
            <button id="btn-next" hidden>Next &rarr;</button>
            <button id="btn-again" hidden>Play again</button>
            <a href=".">Back to Lesson Plan</a>
        </div>
    </main>
    <script src="reliability-validity-targets.js"></script>
</body>
</html>
