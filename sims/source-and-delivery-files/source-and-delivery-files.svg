<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Source Files and Delivery Files</title>
<desc>Three zones under an arrow from source, change this, to delivery, read this. Good source: Markdown and plain text, HTML, OpenDocument text, CSV for data, and SVG for diagrams. All five are open formats and good sources. Usually acceptable: a Word document, whose format is a published standard but whose full fidelity depends on particular software. Poor source: a PDF, which is an open international standard but is built for reading, and a page layout or design-program file, which is closed and poor unless you own the program. Each tile has a round badge for open and a square badge for good source.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Source Files and Delivery Files</text>
<text x="40" y="80" font-size="18" fill="#4a5666">Open is not the same as editable. The round badge asks &quot;is it open?&quot; The square badge asks &quot;is it a good source?&quot;</text>
