<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>What Each Automated Check Can and Cannot Find</title>
<desc>Four tools, each with a finds half and a cannot-find half. Link checker: finds links that return errors or have moved; cannot find a working link that leads to the wrong content. Accessibility scan: finds missing alt attributes, weak contrast, and missing labels; cannot find whether alt text is useful or captions are accurate. License detection: finds missing, mismatched, or unrecognized license statements; cannot find whether the license claim is true. Readability scan: gives a reading level for each passage; cannot find undefined terms, dense ideas, or audience fit. A footer says keep a human in the loop.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">What Each Automated Check Can and Cannot Find</text>
<text x="40" y="80" font-size="18" fill="#4a5666">A clean scan is not a finished review. Every tool has a lit half and a dark half.</text>
<rect x="30" y="106" width="274.5" height="510" rx="14" fill="#ffffff" stroke="#1d4f86" stroke-width="3"/>
