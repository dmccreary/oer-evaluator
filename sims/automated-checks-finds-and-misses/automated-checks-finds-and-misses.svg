<text x="68" y="350" font-size="14.5" fill="#1b2a41">Links that return errors</text>
<circle cx="58" cy="366.4" r="3.5" fill="#1d4f86"/>
<text x="68" y="371.4" font-size="14.5" fill="#1b2a41">Links that have moved</text>
