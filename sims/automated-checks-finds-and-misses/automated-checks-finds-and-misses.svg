<circle cx="64" cy="510" r="11" fill="#b71c1c"/>
<line x1="59.6" y1="505.6" x2="68.4" y2="514.4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<line x1="59.6" y1="514.4" x2="68.4" y2="505.6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<text x="84" y="516" font-size="15" fill="#7f1313" font-weight="bold">CANNOT FIND</text>
<circle cx="58" cy="539" r="3.5" fill="#1b2a41"/>
<text x="68" y="544" font-size="14.5" fill="#1b2a41">A working link that leads to the</text>
<text x="68" y="561.4" font-size="14.5" fill="#1b2a41">wrong content</text>
