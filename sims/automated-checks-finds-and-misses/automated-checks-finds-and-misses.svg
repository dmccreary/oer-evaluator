<line x1="348.1" y1="505.6" x2="356.9" y2="514.4" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
<line x1="348.1" y1="514.4" x2="356.9" y2="505.6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
