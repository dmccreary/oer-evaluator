<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>From Ten Scores to One Decision</title>
<desc>A funnel from left to right in five stages. Stage 1: ten vertical bars for the ten metric scores of Watershed Basics, five blue quality bars and five purple reusability bars, with a dashed floor line at 5. Stage 2: two subtotal bars, quality 32 of 50 and reusability 33 of 50. Stage 3: one total bar, 65 of 100. Stage 4: a band scale with five bands, Poor 0 to 24, Weak 25 to 49, Fair 50 to 74, Good 75 to 89, Excellent 90 to 100, with a pointer in Fair. Stage 5: three decision icons, a check for Adopt, a pencil for Revise, and a cross for Reject, with Revise highlighted. An inset in the lower right shows One Gap: nine tall bars and one short bar below the dashed floor line, so a total of 85 still ends in Revise.</desc>
