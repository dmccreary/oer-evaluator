<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>The 5R Permissions: Five Things You May Do</title>
<desc>Five equal panels in a row, numbered 1 to 5. Retain: make and keep your own copy; the question is can I make and keep my own copy. Reuse: use the work as it is; can I use it as it is. Revise: change the work; can I change it. Remix: combine the work with other open work; can I combine it with other open work. Redistribute: share copies with others; can I share copies with others. An arrow under the panels reads: have a copy, use it, change it, combine it, share it.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">The 5R Permissions: Five Things You May Do</text>
<text x="40" y="80" font-size="18" fill="#4a5666">An open license grants five permissions. Ask the test question of any resource.</text>
