<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Bloom&#x27;s Ladder: Six Levels, Measurable Verbs</title>
<desc>A staircase of six steps rising from left to right. 1 Remember: list, name, define. Example: list the five parts of a lesson plan. 2 Understand: explain, summarize, interpret. Example: explain why the seasons change. 3 Apply: calculate, use, solve. Example: calculate the perimeter of a garden. 4 Analyze: distinguish, differentiate, examine. Example: differentiate a cause from an effect in a historical event. 5 Evaluate: judge, critique, justify. Example: judge which of two designs is fairer, and justify the choice. 6 Create: design, compose, construct. Example: design an experiment to test how light affects plant growth. A side panel shows a level mismatch: the outcome says predict, but every activity asks only for recall.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Bloom&#x27;s Ladder: Six Levels, Measurable Verbs</text>
<text x="40" y="80" font-size="18" fill="#4a5666">The revised taxonomy. Write outcomes with the verbs, and match the activities to the same level.</text>
<rect x="30" y="320" width="150" height="330" rx="10" fill="#d0ece7" stroke="#1b2a41" stroke-width="2"/>
<circle cx="54" cy="348" r="15" fill="#1b2a41"/>
<text x="54" y="354" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="76" y="354" font-size="17.5" fill="#1b2a41" font-weight="bold">Remember</text>
<text x="42" y="394" font-size="22" fill="#1b2a41" font-weight="bold">list</text>
<text x="42" y="422" font-size="22" fill="#1b2a41" font-weight="bold">name</text>
<text x="42" y="450" font-size="22" fill="#1b2a41" font-weight="bold">define</text>
<line x1="42" y1="470" x2="168" y2="470" stroke="#1b2a41" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
<text x="42" y="492" font-size="12" fill="#1b2a41" font-weight="bold" letter-spacing="1">EXAMPLE</text>
<text x="42" y="512" font-size="14.5" fill="#1b2a41">List the five parts</text>
<text x="42" y="529.7" font-size="14.5" fill="#1b2a41">of a lesson plan.</text>
<rect x="186" y="274" width="150" height="376" rx="10" fill="#a3dad0" stroke="#1b2a41" stroke-width="2"/>
<circle cx="210" cy="302" r="15" fill="#1b2a41"/>
<text x="210" y="308" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="232" y="308" font-size="16.5" fill="#1b2a41" font-weight="bold">Understand</text>
<text x="198" y="348" font-size="22" fill="#1b2a41" font-weight="bold">explain</text>
<text x="198" y="376" font-size="22" fill="#1b2a41" font-weight="bold">summarize</text>
<text x="198" y="404" font-size="22" fill="#1b2a41" font-weight="bold">interpret</text>
<line x1="198" y1="424" x2="324" y2="424" stroke="#1b2a41" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
<text x="198" y="446" font-size="12" fill="#1b2a41" font-weight="bold" letter-spacing="1">EXAMPLE</text>
<text x="198" y="466" font-size="14.5" fill="#1b2a41">Explain why the</text>
<text x="198" y="483.7" font-size="14.5" fill="#1b2a41">seasons change.</text>
<rect x="342" y="228" width="150" height="422" rx="10" fill="#74c4b6" stroke="#1b2a41" stroke-width="2"/>
<circle cx="366" cy="256" r="15" fill="#1b2a41"/>
<text x="366" y="262" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="388" y="262" font-size="20" fill="#1b2a41" font-weight="bold">Apply</text>
<text x="354" y="302" font-size="22" fill="#1b2a41" font-weight="bold">calculate</text>
<text x="354" y="330" font-size="22" fill="#1b2a41" font-weight="bold">use</text>
<text x="354" y="358" font-size="22" fill="#1b2a41" font-weight="bold">solve</text>
<line x1="354" y1="378" x2="480" y2="378" stroke="#1b2a41" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
<text x="354" y="400" font-size="12" fill="#1b2a41" font-weight="bold" letter-spacing="1">EXAMPLE</text>
<text x="354" y="420" font-size="14.5" fill="#1b2a41">Calculate the</text>
<text x="354" y="437.7" font-size="14.5" fill="#1b2a41">perimeter of a</text>
<text x="354" y="455.4" font-size="14.5" fill="#1b2a41">garden.</text>
<rect x="498" y="182" width="150" height="468" rx="10" fill="#2a7f73" stroke="#2a7f73" stroke-width="2"/>
<circle cx="522" cy="210" r="15" fill="#ffffff"/>
<text x="522" y="216" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">4</text>
<text x="544" y="216" font-size="20" fill="#ffffff" font-weight="bold">Analyze</text>
<text x="510" y="256" font-size="19" fill="#ffffff" font-weight="bold">distinguish</text>
<text x="510" y="284" font-size="19" fill="#ffffff" font-weight="bold">differentiate</text>
<text x="510" y="312" font-size="22" fill="#ffffff" font-weight="bold">examine</text>
<line x1="510" y1="332" x2="636" y2="332" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
<text x="510" y="354" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1">EXAMPLE</text>
<text x="510" y="374" font-size="14.5" fill="#ffffff">Differentiate a</text>
<text x="510" y="391.7" font-size="14.5" fill="#ffffff">cause from an</text>
<text x="510" y="409.4" font-size="14.5" fill="#ffffff">effect in a</text>
<text x="510" y="427.1" font-size="14.5" fill="#ffffff">historical event.</text>
<rect x="654" y="136" width="150" height="514" rx="10" fill="#1a6559" stroke="#1a6559" stroke-width="2"/>
<circle cx="678" cy="164" r="15" fill="#ffffff"/>
<text x="678" y="170" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">5</text>
<text x="700" y="170" font-size="20" fill="#ffffff" font-weight="bold">Evaluate</text>
<text x="666" y="210" font-size="22" fill="#ffffff" font-weight="bold">judge</text>
<text x="666" y="238" font-size="22" fill="#ffffff" font-weight="bold">critique</text>
<text x="666" y="266" font-size="22" fill="#ffffff" font-weight="bold">justify</text>
<line x1="666" y1="286" x2="792" y2="286" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
<text x="666" y="308" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1">EXAMPLE</text>
<text x="666" y="328" font-size="14.5" fill="#ffffff">Judge which of</text>
<text x="666" y="345.7" font-size="14.5" fill="#ffffff">two designs is</text>
<text x="666" y="363.4" font-size="14.5" fill="#ffffff">fairer, and justify</text>
<text x="666" y="381.1" font-size="14.5" fill="#ffffff">the choice.</text>
<rect x="810" y="90" width="150" height="560" rx="10" fill="#0e4a41" stroke="#0e4a41" stroke-width="2"/>
<circle cx="834" cy="118" r="15" fill="#ffffff"/>
<text x="834" y="124" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">6</text>
<text x="856" y="124" font-size="20" fill="#ffffff" font-weight="bold">Create</text>
<text x="822" y="164" font-size="22" fill="#ffffff" font-weight="bold">design</text>
<text x="822" y="192" font-size="22" fill="#ffffff" font-weight="bold">compose</text>
<text x="822" y="220" font-size="22" fill="#ffffff" font-weight="bold">construct</text>
<line x1="822" y1="240" x2="948" y2="240" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
<text x="822" y="262" font-size="12" fill="#ffffff" font-weight="bold" letter-spacing="1">EXAMPLE</text>
<text x="822" y="282" font-size="14.5" fill="#ffffff">Design an</text>
<text x="822" y="299.7" font-size="14.5" fill="#ffffff">experiment to test</text>
<text x="822" y="317.4" font-size="14.5" fill="#ffffff">how light affects</text>
<text x="822" y="335.1" font-size="14.5" fill="#ffffff">plant growth.</text>
<rect x="990" y="150" width="180" height="500" rx="12" fill="#ffffff" stroke="#e69500" stroke-width="3"/>
<rect x="990" y="150" width="180" height="46" rx="12" fill="#e69500"/>
<rect x="990" y="174" width="180" height="22" rx="0" fill="#e69500"/>
<text x="1080" y="181" font-size="19" fill="#1b2a41" font-weight="bold" text-anchor="middle">Level mismatch</text>
<text x="1004" y="228" font-size="12" fill="#4a5666" font-weight="bold" letter-spacing="1">OUTCOME SAYS</text>
<rect x="1004" y="238" width="87.3" height="32" rx="16" fill="#1b2a41"/>
<text x="1047.6" y="260.5" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">predict</text>
<text x="1004" y="306" font-size="12" fill="#4a5666" font-weight="bold" letter-spacing="1">ACTIVITIES ASK ONLY</text>
<rect x="1004" y="316" width="73" height="32" rx="16" fill="#6b7785"/>
<text x="1040.5" y="338.5" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">recall</text>
<polygon points="1080,370 1105.2,413.2 1054.8,413.2" fill="#e69500" stroke-linejoin="round"/>
<line x1="1080" y1="386.8" x2="1080" y2="400" stroke="#1b2a41" stroke-width="4.8" stroke-linecap="round"/>
<circle cx="1080" cy="407.2" r="3.2" fill="#1b2a41"/>
<text x="1004" y="446" font-size="15.5" fill="#1b2a41">Learners practice a</text>
<text x="1004" y="465.4" font-size="15.5" fill="#1b2a41">skill the outcome</text>
<text x="1004" y="484.8" font-size="15.5" fill="#1b2a41">does not ask for,</text>
<text x="1004" y="504.1" font-size="15.5" fill="#1b2a41">and never practice</text>
<text x="1004" y="523.5" font-size="15.5" fill="#1b2a41">the skill it does.</text>
<text x="30" y="686" font-size="14" fill="#4a5666">Revised (2001) names. A staircase, not a pyramid: the levels are not a ranking of importance.</text>
</svg>
