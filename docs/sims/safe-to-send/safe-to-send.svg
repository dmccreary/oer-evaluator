<text x="122" y="226" font-size="17" fill="#1b2a41" font-weight="bold">The published text of an open</text>
<text x="122" y="246.4" font-size="17" fill="#1b2a41" font-weight="bold">textbook chapter</text>
<text x="52" y="284" font-size="14.5" fill="#4a5666">It is public and holds no student data.</text>
