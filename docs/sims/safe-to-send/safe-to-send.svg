<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Safe to Send? Student Data and AI Services</title>
<desc>Three chutes. Send it, marked with a check in a circle: the published text of an open textbook chapter, and a rubric prompt template. They are public or hold no student data. Fix it first, marked with a wrench in a triangle: a class&#x27;s quiz scores with student names. The names make the scores personal data, so anonymize or get approval first. Never send it, marked with a stop sign: a spreadsheet of grades with student ID numbers, a student&#x27;s photograph shown as a silhouette, and an email thread with a parent about a student. A footer says that once text is sent to an AI service you cannot pull it back, names FERPA, and says if you are not sure, ask before you send.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Safe to Send? Student Data and AI Services</text>
<text x="40" y="80" font-size="18" fill="#4a5666">Sort before you paste. Three chutes, six items from Chapter 13.</text>
