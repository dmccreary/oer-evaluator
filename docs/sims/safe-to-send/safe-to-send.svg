<text x="507.3" y="246.4" font-size="17" fill="#1b2a41" font-weight="bold">student names</text>
<text x="437.3" y="290" font-size="14.5" fill="#1b2a41">Names make the scores personal data, so</text>
<text x="437.3" y="307.4" font-size="14.5" fill="#1b2a41">anonymize or get approval first.</text>
