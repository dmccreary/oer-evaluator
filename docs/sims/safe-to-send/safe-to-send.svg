<text x="100" y="634" font-size="21" fill="#1b2a41" font-weight="bold">Once it is sent, you cannot pull it back.</text>
<text x="100" y="660" font-size="15.5" fill="#1b2a41">Text pasted into an AI service has left your computer, and a deletion request may not undo it. FERPA protects student education records. If you</text>
<text x="100" y="678.6" font-size="15.5" fill="#1b2a41">are not sure, ask before you send.</text>
