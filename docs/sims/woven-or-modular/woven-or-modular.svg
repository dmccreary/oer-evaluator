<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Woven or Modular? The Lift-Out Test</title>
<desc>Two zones. Woven design: one long page in which a reading, a quiz, and a simulation are interlaced threads of one cloth, with sticky notes &quot;as we saw in the last section&quot; and &quot;the diagram above&quot;. Modular design: a reading, a quiz, and a simulation as three separate blocks in separate folders, with the quiz block lifted away. Four comparison rows. Structure: one long page that mixes explanation, a quiz, and a simulation, against separate pieces. Taking out the quiz: copy it from the middle of the page and repair the links, against link or embed the quiz&#x27;s own page. Revising the simulation: edit the whole page and risk breaking the reading, against edit the simulation&#x27;s folder. Reuse by another teacher: take everything or nothing, against take any piece. A strip shows degrees of modularity from a single page, to a page with sections, to one file per part, to each part packaged with its own license and metadata.</desc>
