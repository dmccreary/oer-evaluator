<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>What a Screen Reader Hears</title>
<desc>Two columns, what is seen and what is heard, in four rows. Row 1: a heading &quot;How water moves&quot; at level 2; the screen reader says &quot;Heading level 2, How water moves&quot;. Row 2: a photograph of a river with alt text &quot;A river meandering through a valley&quot;; it says &quot;Image, A river meandering through a valley&quot;. Row 3: the same photograph with no alt attribute; it says &quot;Image, river.png&quot;, reading the file name. Row 4: the same photograph with an empty alt attribute; it says nothing, because the image is skipped, which is correct only for a decorative image.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">What a Screen Reader Hears</text>
<text x="40" y="80" font-size="18" fill="#4a5666">The same page, four ways. What you see on the left is not what a screen reader announces on the right.</text>
<rect x="30" y="108" width="560" height="534" rx="14" fill="#ffffff" stroke="#1d4f86" stroke-width="3"/>
<rect x="30" y="108" width="560" height="48" rx="14" fill="#1d4f86"/>
<rect x="30" y="134" width="560" height="22" rx="0" fill="#1d4f86"/>
<circle cx="60" cy="132" r="17" fill="#ffffff"/>
<path d="M48,132 Q60,121.2 72,132 Q60,142.8 48,132 z" fill="#ffffff" stroke="#1d4f86" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="60" cy="132" r="3.6" fill="#1d4f86"/>
<text x="88" y="140" font-size="23" fill="#ffffff" font-weight="bold">What is seen</text>
<rect x="610" y="108" width="560" height="534" rx="14" fill="#ffffff" stroke="#573379" stroke-width="3"/>
<rect x="610" y="108" width="560" height="48" rx="14" fill="#573379"/>
<rect x="610" y="134" width="560" height="22" rx="0" fill="#573379"/>
<circle cx="640" cy="132" r="17" fill="#ffffff"/>
<polygon points="630.4,128.4 635.8,128.4 641.2,123.6 641.2,140.4 635.8,135.6 630.4,135.6" fill="#573379" stroke-linejoin="round"/>
<path d="M644.8,127.8 q3.6,4.2 0,8.4" fill="none" stroke="#573379" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M647.8,124.2 q6.6,7.8 0,15.6" fill="none" stroke="#573379" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="668" y="140" font-size="23" fill="#ffffff" font-weight="bold">What is heard</text>
<rect x="40" y="170" width="540" height="110" rx="10" fill="#e6eef8"/>
<rect x="620" y="170" width="540" height="110" rx="10" fill="#efe6f6"/>
<circle cx="58" cy="192" r="13" fill="#1d4f86"/>
<text x="58" y="198" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<circle cx="638" cy="192" r="13" fill="#573379"/>
<text x="638" y="198" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="86" y="232" font-size="32" fill="#1b2a41" font-weight="bold">How water moves</text>
<line x1="86" y1="244" x2="360" y2="244" stroke="#c9d1db" stroke-width="3" stroke-linecap="round"/>
<rect x="674" y="182" width="460" height="54" rx="10" fill="#ffffff" stroke="#573379" stroke-width="2.5"/>
<polygon points="676,200.9 660,209 676,217.1" fill="#ffffff" stroke="#573379" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="675.2" y1="202.5" x2="675.2" y2="215.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="butt"/>
<text x="694" y="217" font-size="20" fill="#1b2a41" font-weight="bold">“Heading level 2, How water moves”</text>
<text x="674" y="256" font-size="15" fill="#4a5666">Real headings are announced with their level.</text>
<rect x="40" y="291" width="540" height="110" rx="10" fill="#e6eef8"/>
<rect x="620" y="291" width="540" height="110" rx="10" fill="#efe6f6"/>
<circle cx="58" cy="313" r="13" fill="#1d4f86"/>
<text x="58" y="319" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<circle cx="638" cy="313" r="13" fill="#573379"/>
<text x="638" y="319" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<rect x="86" y="305" width="130" height="82" rx="0" fill="#bfe3f5" stroke="#1b2a41" stroke-width="2.5"/>
<polygon points="86,355.8 125,331.2 157.5,352.6 190,328 216,346 216,387 86,387" fill="#7fb87a" stroke-linejoin="round"/>
<path d="M131.5,387 Q164.0,372.24 144.5,359.12 T177.0,349.28" fill="none" stroke="#2f7fc1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="86" y="305" width="130" height="82" rx="0" fill="none" stroke="#1b2a41" stroke-width="2.5"/>
<text x="234" y="327" font-size="16" fill="#1b2a41" font-weight="bold">An image with alt text &quot;A river</text>
<text x="234" y="347" font-size="16" fill="#1b2a41" font-weight="bold">meandering through a valley&quot;</text>
<rect x="674" y="303" width="460" height="54" rx="10" fill="#ffffff" stroke="#573379" stroke-width="2.5"/>
<polygon points="676,321.9 660,330 676,338.1" fill="#ffffff" stroke="#573379" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="675.2" y1="323.5" x2="675.2" y2="336.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="butt"/>
<text x="694" y="338" font-size="18" fill="#1b2a41" font-weight="bold">“Image, A river meandering through a valley”</text>
<text x="674" y="377" font-size="15" fill="#4a5666">The alt text does its job.</text>
<rect x="40" y="412" width="540" height="110" rx="10" fill="#e6eef8"/>
<rect x="620" y="412" width="540" height="110" rx="10" fill="#efe6f6"/>
<circle cx="58" cy="434" r="13" fill="#1d4f86"/>
<text x="58" y="440" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<circle cx="638" cy="434" r="13" fill="#573379"/>
<text x="638" y="440" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<rect x="86" y="426" width="130" height="82" rx="0" fill="#bfe3f5" stroke="#1b2a41" stroke-width="2.5"/>
<polygon points="86,476.8 125,452.2 157.5,473.6 190,449 216,467 216,508 86,508" fill="#7fb87a" stroke-linejoin="round"/>
<path d="M131.5,508 Q164.0,493.24 144.5,480.12 T177.0,470.28" fill="none" stroke="#2f7fc1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="86" y="426" width="130" height="82" rx="0" fill="none" stroke="#1b2a41" stroke-width="2.5"/>
<text x="234" y="448" font-size="16" fill="#1b2a41" font-weight="bold">An image with no alt attribute (the file is</text>
<text x="234" y="468" font-size="16" fill="#1b2a41" font-weight="bold">river.png)</text>
<rect x="674" y="424" width="460" height="54" rx="10" fill="#ffffff" stroke="#573379" stroke-width="2.5"/>
<polygon points="676,442.9 660,451 676,459.1" fill="#ffffff" stroke="#573379" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="675.2" y1="444.5" x2="675.2" y2="457.5" stroke="#ffffff" stroke-width="3.5" stroke-linecap="butt"/>
<text x="694" y="459" font-size="20" fill="#1b2a41" font-weight="bold">“Image, river.png”</text>
<text x="674" y="498" font-size="15" fill="#4a5666">The file name is read, which is useless.</text>
<rect x="40" y="533" width="540" height="110" rx="10" fill="#e6eef8"/>
<rect x="620" y="533" width="540" height="110" rx="10" fill="#efe6f6"/>
<circle cx="58" cy="555" r="13" fill="#1d4f86"/>
<text x="58" y="561" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<circle cx="638" cy="555" r="13" fill="#573379"/>
<text x="638" y="561" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<rect x="86" y="547" width="130" height="82" rx="0" fill="#bfe3f5" stroke="#1b2a41" stroke-width="2.5"/>
<polygon points="86,597.8 125,573.2 157.5,594.6 190,570 216,588 216,629 86,629" fill="#7fb87a" stroke-linejoin="round"/>
<path d="M131.5,629 Q164.0,614.24 144.5,601.12 T177.0,591.28" fill="none" stroke="#2f7fc1" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="86" y="547" width="130" height="82" rx="0" fill="none" stroke="#1b2a41" stroke-width="2.5"/>
<text x="234" y="569" font-size="16" fill="#1b2a41" font-weight="bold">An image with an empty alt attribute</text>
<rect x="674" y="545" width="460" height="54" rx="10" fill="#ffffff" stroke="#6b7785" stroke-width="2.5" stroke-dasharray="7 6"/>
<text x="694" y="580" font-size="20" fill="#4a5666" font-weight="bold">(nothing is announced)</text>
<text x="674" y="619" font-size="15" fill="#4a5666">The image is skipped, which is correct only for a decorative</text>
<text x="674" y="637" font-size="15" fill="#4a5666">image.</text>
<text x="40" y="672" font-size="15" fill="#4a5666">Typical announcements. Wording varies between screen reader programs, and some read the file name in other ways.</text>
</svg>
