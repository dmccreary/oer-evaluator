<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Anatomy of a Rubric Worksheet MicroSim using SVG and JavaScript</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: black; background: aliceblue; }
        main { height: 100%; box-sizing: border-box; padding: 8px 12px 6px 12px; display: flex; flex-direction: column; gap: 8px; }
        #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        button { font: inherit; padding: 5px 14px; color: black; background: white; border: 2px solid dimgray; border-radius: 8px; cursor: pointer; }
        button:hover:not(:disabled) { background: lightcyan; border-color: navy; }
        button.on, #btn-next, #btn-again { color: white; background: navy; border-color: navy; font-weight: bold; }
        button:disabled { color: white; background: lightsteelblue; border-color: lightsteelblue; cursor: default; }
        button:focus-visible, .zone:focus-visible { outline: 3px solid black; outline-offset: 2px; }
        button[hidden] { display: none; }
        #progress { display: inline-flex; gap: 3px; margin-left: auto; }
        .seg { width: 20px; height: 16px; border: 1px solid silver; border-radius: 3px; background: gainsboro; }
        .seg.ok { background: seagreen; }
        .seg.miss { background: firebrick; }
        .seg.cur { border: 2px solid black; }
        #stage { flex: 0 1 auto; min-height: 0; display: flex; justify-content: center; }
        #poster { width: 100%; height: auto; max-height: 54vh; background: white; border: 1px solid silver; border-radius: 10px; }
        #panel { flex: 1 1 auto; min-height: 0; overflow: auto; background: white; border: 2px solid slategray; border-radius: 10px; padding: 4px 12px 8px 12px; line-height: 1.3; }
        #panel h2 { margin: 6px 0 2px 0; font-size: 20px; }
        #panel h2.pass { color: darkgreen; }
        #panel p { margin: 4px 0; }
        #panel ul { margin: 2px 0 2px 0; padding-left: 22px; }
        #panel .prompt { color: dimgray; }
        #panel .tip { color: dimgray; font-style: italic; }
        #panel .qhead { font-weight: bold; color: dimgray; margin-bottom: 0; }
        #panel .question { font-size: 18px; }
        #panel .feedback { padding: 6px 10px; border-radius: 8px; border: 3px solid; }
        #panel .feedback.good { color: darkgreen; background: honeydew; border-color: seagreen; }
        #panel .feedback.bad { color: firebrick; background: mistyrose; border-color: firebrick; }
        #panel .feedback.hint { color: saddlebrown; background: lemonchiffon; border-color: darkgoldenrod; }
        #actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 36px; }
        #actions a { margin-left: auto; font-size: 14px; }
        .zone { cursor: pointer; outline: none; }
        .zone .region { fill: rgba(255, 215, 0, 0.25); stroke: darkorange; stroke-width: 4; opacity: 0; pointer-events: none; }
        .zone:hover .region, .zone.active .region, .zone:focus-visible .region { opacity: 1; }
        .zone.correct .region { opacity: 1; fill: rgba(46, 139, 87, 0.25); stroke: seagreen; }
        .zone.wrong .region { opacity: 1; fill: rgba(178, 34, 34, 0.2); stroke: firebrick; }
        .marker circle { fill: navy; stroke: white; stroke-width: 3; }
        .marker text { fill: white; font: bold 19px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
        .zone:hover .marker circle, .zone.active .marker circle, .zone:focus-visible .marker circle { fill: darkorange; }
        .zone.correct .marker circle { fill: seagreen; }
        .zone.wrong .marker circle { fill: firebrick; }
        .ptitle { font: bold 30px Arial, Helvetica, sans-serif; fill: #1b2a41; pointer-events: none; }
        .ttitle { font: bold 24px Arial, Helvetica, sans-serif; fill: #1b2a41; text-anchor: middle; pointer-events: none; }
    </style>
</head>
