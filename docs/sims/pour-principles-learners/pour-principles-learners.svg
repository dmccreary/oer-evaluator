<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Four Principles, Five Learners</title>
<desc>Four equal zones headed P, O, U, and R. Perceivable asks can users perceive the content; its example criterion is that non-text content has a text alternative; it protects a blind learner who needs text descriptions and a clear heading structure, a deaf learner who needs captions, and a learner with low vision who needs strong color contrast. Operable asks can users operate the controls; its example criterion is that all functions work with a keyboard; it protects a learner who cannot use a mouse and needs keyboard navigation. Understandable asks can users follow it; its example criterion is that the language of the page is identified; it protects a learner with a reading disability who needs clear structure and short paragraphs. Robust asks does it work with assistive technology; its example criterion is that custom controls expose a name and role.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Four Principles, Five Learners</text>
<text x="40" y="80" font-size="18" fill="#4a5666">WCAG groups its criteria under four principles. Each one exists for real people.</text>
