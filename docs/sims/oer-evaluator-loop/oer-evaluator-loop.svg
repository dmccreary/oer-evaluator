<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>The OER Evaluator Loop</title>
<desc>A closed loop of eight numbered stations. 1 Understand OER and licenses, Chapters 1 and 2. 2 Score a resource by hand with the ten-metric rubric, Chapters 3 to 11. 3 Direct an AI agent to make a first pass, Chapters 12 and 13. 4 Check the agent&#x27;s evidence, Chapter 14. 5 Improve the lowest metrics with agents, Chapter 15. 6 Test the change with students in an A/B test, Chapters 16 and 17. 7 Calibrate the agent against the test results, Chapters 14 and 17. 8 Publish and train others, Chapters 18 and 19. A thick return arrow runs from station 7 back to station 3. Stations 1 to 4 are one color, station 5 another, and stations 6 to 8 a third.</desc>
