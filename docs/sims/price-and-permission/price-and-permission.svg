<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Free Is Not Open: Price and Permission</title>
<desc>A two-by-two matrix. Columns: costs the user nothing, and costs money. Rows: may edit and share (open), and may not edit or share (closed). Top left: a lesson plan licensed CC BY 4.0 is free and open. Top right: an open textbook that a print shop sells at cost is open, and only the printed copy costs money. Bottom left: a publisher sample chapter marked all rights reserved is free but closed. Bottom right: a commercial textbook from the campus store costs money and is closed. A bracket around the top row says OER is defined by permission, not price. Two dials, price and permission, point to different settings.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">Free Is Not Open</text>
<text x="40" y="80" font-size="18" fill="#4a5666">Price and permission are two separate dials. OER is defined by permission.</text>
<path d="M878,78 A52,52 0 0 1 982,78" fill="none" stroke="#c9d1db" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M878,78 A52,52 0 0 1 879.6336756213112,65.06812586742755" fill="none" stroke="#e69500" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round"/>
<line x1="930" y1="78" x2="889.3" y2="67.6" stroke="#1b2a41" stroke-width="4" stroke-linecap="round"/>
<circle cx="930" cy="78" r="7" fill="#1b2a41"/>
<text x="930" y="106" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">Price</text>
<path d="M1048,78 A52,52 0 0 1 1152,78" fill="none" stroke="#c9d1db" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round"/>
<path d="M1048,78 A52,52 0 0 1 1150.366324378689,65.06812586742755" fill="none" stroke="#00796b" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round"/>
<line x1="1100" y1="78" x2="1140.7" y2="67.6" stroke="#1b2a41" stroke-width="4" stroke-linecap="round"/>
<circle cx="1100" cy="78" r="7" fill="#1b2a41"/>
<text x="1100" y="106" font-size="17" fill="#1b2a41" font-weight="bold" text-anchor="middle">Permission</text>
<rect x="250" y="138" width="447" height="40" rx="8" fill="#1b2a41"/>
<text x="473.5" y="165" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle">Costs the user nothing</text>
<rect x="713" y="138" width="447" height="40" rx="8" fill="#1b2a41"/>
<text x="936.5" y="165" font-size="20" fill="#ffffff" font-weight="bold" text-anchor="middle">Costs money</text>
<rect x="30" y="212" width="200" height="208" rx="14" fill="#00796b"/>
<rect x="109" y="271" width="42" height="30" rx="4.5" fill="#ffffff"/>
<path d="M140.5,271 v-7.5 a10.5,10.5 0 0 1 21,0 v4.5" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="130" cy="284.5" r="3.6" fill="#ffffff"/>
<text x="130" y="340" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">May edit and</text>
<text x="130" y="365.2" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">share</text>
<text x="130" y="400" font-size="17" fill="#ffffff" text-anchor="middle">open license</text>
<rect x="30" y="444" width="200" height="208" rx="14" fill="#6b7785"/>
<rect x="109" y="503" width="42" height="30" rx="4.5" fill="#ffffff"/>
<path d="M119.5,503 v-9 a10.5,10.5 0 0 1 21,0 v9" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="130" cy="516.5" r="3.6" fill="#ffffff"/>
<text x="130" y="572" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">May not edit or</text>
<text x="130" y="597.2" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">share</text>
<text x="130" y="632" font-size="17" fill="#ffffff" text-anchor="middle">all rights reserved</text>
<rect x="250" y="212" width="447" height="208" rx="14" fill="#e3f4f1" stroke="#00796b" stroke-width="3"/>
<circle cx="302" cy="274" r="36" fill="#ffffff" stroke="#00796b" stroke-width="3"/>
<rect x="288" y="270" width="28" height="20" rx="3" fill="#004d40"/>
<path d="M309,270 v-5 a7,7 0 0 1 14,0 v3" fill="none" stroke="#004d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="302" cy="279" r="2.4" fill="#ffffff"/>
<circle cx="328" cy="300" r="13" fill="#2e7d32"/>
<path d="M322.1,300 L326.7,304.9 L334.5,295.1" fill="none" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="356" y="254" font-size="24" fill="#004d40" font-weight="bold">Free and open</text>
<text x="356" y="288" font-size="18" fill="#1b2a41" font-weight="bold">A lesson plan with a CC BY 4.0</text>
<text x="356" y="310.5" font-size="18" fill="#1b2a41" font-weight="bold">license</text>
<text x="356" y="341" font-size="18" fill="#1b2a41">Costs nothing. You may edit and</text>
<text x="356" y="364" font-size="18" fill="#1b2a41">share it, with credit to the author.</text>
<rect x="713" y="212" width="447" height="208" rx="14" fill="#e3f4f1" stroke="#00796b" stroke-width="3"/>
<circle cx="765" cy="274" r="36" fill="#ffffff" stroke="#00796b" stroke-width="3"/>
<rect x="751" y="270" width="28" height="20" rx="3" fill="#004d40"/>
<path d="M772,270 v-5 a7,7 0 0 1 14,0 v3" fill="none" stroke="#004d40" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="765" cy="279" r="2.4" fill="#ffffff"/>
<circle cx="791" cy="300" r="13" fill="#2e7d32"/>
<path d="M785.1,300 L789.7,304.9 L797.5,295.1" fill="none" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/>
<text x="819" y="254" font-size="22.5" fill="#004d40" font-weight="bold">Open, with a paid print copy</text>
<text x="819" y="288" font-size="18" fill="#1b2a41" font-weight="bold">An open textbook that a print shop</text>
<text x="819" y="310.5" font-size="18" fill="#1b2a41" font-weight="bold">sells at cost</text>
<text x="819" y="341" font-size="18" fill="#1b2a41">The digital copy is free. Only the</text>
<text x="819" y="364" font-size="18" fill="#1b2a41">printed copy costs money, and you</text>
<text x="819" y="387.1" font-size="18" fill="#1b2a41">may still edit and share it.</text>
<rect x="250" y="444" width="447" height="208" rx="14" fill="#eef1f5" stroke="#6b7785" stroke-width="3"/>
<circle cx="302" cy="506" r="36" fill="#ffffff" stroke="#6b7785" stroke-width="3"/>
<rect x="288" y="502" width="28" height="20" rx="3" fill="#3d4856"/>
<path d="M295,502 v-6 a7,7 0 0 1 14,0 v6" fill="none" stroke="#3d4856" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="302" cy="511" r="2.4" fill="#ffffff"/>
<circle cx="328" cy="532" r="13" fill="#b71c1c"/>
<line x1="322.8" y1="526.8" x2="333.2" y2="537.2" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round"/>
<line x1="322.8" y1="537.2" x2="333.2" y2="526.8" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round"/>
<text x="356" y="486" font-size="24" fill="#3d4856" font-weight="bold">Free but closed</text>
<text x="356" y="520" font-size="18" fill="#1b2a41" font-weight="bold">A publisher&#x27;s sample chapter</text>
<text x="356" y="542.5" font-size="18" fill="#1b2a41" font-weight="bold">marked &quot;All rights reserved&quot;</text>
<text x="356" y="573" font-size="18" fill="#1b2a41">Costs nothing, but you may not edit or</text>
<text x="356" y="596" font-size="18" fill="#1b2a41">share it.</text>
<rect x="713" y="444" width="447" height="208" rx="14" fill="#eef1f5" stroke="#6b7785" stroke-width="3"/>
<circle cx="765" cy="506" r="36" fill="#ffffff" stroke="#6b7785" stroke-width="3"/>
<rect x="751" y="502" width="28" height="20" rx="3" fill="#3d4856"/>
<path d="M758,502 v-6 a7,7 0 0 1 14,0 v6" fill="none" stroke="#3d4856" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="765" cy="511" r="2.4" fill="#ffffff"/>
<circle cx="791" cy="532" r="13" fill="#b71c1c"/>
<line x1="785.8" y1="526.8" x2="796.2" y2="537.2" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round"/>
<line x1="785.8" y1="537.2" x2="796.2" y2="526.8" stroke="#ffffff" stroke-width="2.9" stroke-linecap="round"/>
<text x="819" y="486" font-size="24" fill="#3d4856" font-weight="bold">Paid and closed</text>
<text x="819" y="520" font-size="18" fill="#1b2a41" font-weight="bold">A commercial textbook from the</text>
<text x="819" y="542.5" font-size="18" fill="#1b2a41" font-weight="bold">campus store</text>
<text x="819" y="573" font-size="18" fill="#1b2a41">Costs money and grants no</text>
<text x="819" y="596" font-size="18" fill="#1b2a41">permission to edit or share.</text>
<rect x="242" y="196" width="926" height="240" rx="18" fill="none" stroke="#00796b" stroke-width="3" stroke-dasharray="10 7"/>
<rect x="564" y="184" width="282" height="28" rx="14" fill="#00796b"/>
<text x="705" y="203.8" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">OER: open, whatever the price</text>
<text x="40" y="686" font-size="15" fill="#4a5666">Illustrative examples drawn from Chapter 1. Open means the license grants permissions; it says nothing about quality.</text>
</svg>
