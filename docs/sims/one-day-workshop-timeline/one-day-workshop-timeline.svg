<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>A One-Day Workshop Timeline</title>
<desc>A timeline from 8:30 to 3:30 with block widths in proportion to time. 1 Check-in and setup, 8:30 to 9:00, leaves teachers with a working agent session. 2 The ten metrics, 9:00 to 9:45, a rubric card. 3 Calibration, 9:45 to 10:45, hand and agent scores with gaps explained; a 15-minute break follows. 4 Checking the agent, 11:00 to 12:00, a verified evaluation of the sample. 5 Lunch, 12:00 to 12:45. 6 The improvement challenge, 12:45 to 2:15, an improved component and its new score; a 15-minute break follows. 7 Peer review and publishing, 2:30 to 3:15, a published, openly licensed component. 8 Next steps, 3:15 to 3:30, a certificate checklist. An arc from block 2 to block 3 shows the rubric before calibration, and an arc from block 4 to block 6 shows checking before improving.</desc>
