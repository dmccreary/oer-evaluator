<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Six Creative Commons Licenses Poster MicroSim using SVG and JavaScript</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: black; background: aliceblue; }
        main { height: 100%; box-sizing: border-box; padding: 8px 12px 6px 12px; display: flex; flex-direction: column; gap: 8px; }
        #bar { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        button { font: inherit; padding: 5px 14px; color: black; background: white; border: 2px solid dimgray; border-radius: 8px; cursor: pointer; }
        button:hover:not(:disabled) { background: lightcyan; border-color: navy; }
        button.on, #btn-next, #btn-again { color: white; background: navy; border-color: navy; font-weight: bold; }
        button:disabled { color: white; background: lightsteelblue; border-color: lightsteelblue; cursor: default; }
        button:focus-visible, .zone:focus-visible { outline: 3px solid black; outline-offset: 2px; }
        button[hidden] { display: none; }
        #progress { display: inline-flex; gap: 3px; margin-left: auto; }
        .seg { width: 20px; height: 16px; border: 1px solid silver; border-radius: 3px; background: gainsboro; }
        .seg.ok { background: seagreen; }
        .seg.miss { background: firebrick; }
        .seg.cur { border: 2px solid black; }
        #stage { flex: 0 1 auto; min-height: 0; display: flex; justify-content: center; }
        #poster { width: 100%; height: auto; max-height: 54vh; background: white; border: 1px solid silver; border-radius: 10px; }
        #panel { flex: 1 1 auto; min-height: 0; overflow: auto; background: white; border: 2px solid slategray; border-radius: 10px; padding: 4px 12px 8px 12px; line-height: 1.3; }
        #panel h2 { margin: 6px 0 2px 0; font-size: 20px; }
        #panel h2.pass { color: darkgreen; }
        #panel p { margin: 4px 0; }
        #panel ul { margin: 2px 0 2px 0; padding-left: 22px; }
        #panel .prompt { color: dimgray; }
        #panel .tip { color: dimgray; font-style: italic; }
        #panel .qhead { font-weight: bold; color: dimgray; margin-bottom: 0; }
        #panel .question { font-size: 18px; }
        #panel .feedback { padding: 6px 10px; border-radius: 8px; border: 3px solid; }
        #panel .feedback.good { color: darkgreen; background: honeydew; border-color: seagreen; }
        #panel .feedback.bad { color: firebrick; background: mistyrose; border-color: firebrick; }
        #panel .feedback.hint { color: saddlebrown; background: lemonchiffon; border-color: darkgoldenrod; }
        #actions { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; min-height: 36px; }
        #actions a { margin-left: auto; font-size: 14px; }
        .zone { cursor: pointer; outline: none; }
        .zone .region { fill: rgba(255, 215, 0, 0.25); stroke: darkorange; stroke-width: 4; opacity: 0; pointer-events: none; }
        .zone:hover .region, .zone.active .region, .zone:focus-visible .region { opacity: 1; }
        .zone.correct .region { opacity: 1; fill: rgba(46, 139, 87, 0.25); stroke: seagreen; }
        .zone.wrong .region { opacity: 1; fill: rgba(178, 34, 34, 0.2); stroke: firebrick; }
        .marker circle { fill: navy; stroke: white; stroke-width: 3; }
        .marker text { fill: white; font: bold 19px Arial, Helvetica, sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
        .zone:hover .marker circle, .zone.active .marker circle, .zone:focus-visible .marker circle { fill: darkorange; }
        .zone.correct .marker circle { fill: seagreen; }
        .zone.wrong .marker circle { fill: firebrick; }
        .ptitle { font: bold 30px Arial, Helvetica, sans-serif; fill: #1b2a41; pointer-events: none; }
        .ttitle { font: bold 24px Arial, Helvetica, sans-serif; fill: #1b2a41; text-anchor: middle; pointer-events: none; }
    </style>
</head>
<body>
    <main>
        <div id="bar">
            <button id="btn-explore" class="on" aria-pressed="true">Explore</button>
            <button id="btn-quiz" aria-pressed="false">Quiz me</button>
            <span id="progress" aria-hidden="true"></span>
        </div>
        <div id="stage">
<svg id="poster" viewBox="0 0 900 560" role="group" aria-label="Poster with six Creative Commons license panels in two rows of three: CC BY, CC BY-SA, CC BY-NC, CC BY-NC-SA, CC BY-ND, and CC BY-NC-ND." xmlns="http://www.w3.org/2000/svg">

<defs>
  <g id="i-by"><circle r="16" fill="white" stroke="#222" stroke-width="3"/><circle cx="0" cy="-6" r="4.5" fill="#222"/><path d="M-7,10 V1 a7,7 0 0 1 14,0 V10 Z" fill="#222"/></g>
  <g id="i-sa"><circle r="16" fill="white" stroke="#222" stroke-width="3"/><path d="M-1,-9 A9,9 0 1 1 -8,3" fill="none" stroke="#222" stroke-width="3.5"/><path d="M-12,-1 L-6,8 L-3,-1 Z" fill="#222"/></g>
  <g id="i-nc"><circle r="16" fill="white" stroke="#222" stroke-width="3"/><circle r="7" fill="none" stroke="#222" stroke-width="3"/><path d="M-11,11 L11,-11" stroke="#222" stroke-width="4"/></g>
  <g id="i-nd"><circle r="16" fill="white" stroke="#222" stroke-width="3"/><rect x="-8" y="-6.5" width="16" height="4.5" fill="#222"/><rect x="-8" y="2" width="16" height="4.5" fill="#222"/></g>
  <g id="p-doc"><path d="M-26,-34 H10 L26,-18 V34 H-26 Z" fill="white" stroke="#444" stroke-width="3"/><path d="M10,-34 V-18 H26" fill="none" stroke="#444" stroke-width="3"/><path d="M-16,-4 H16 M-16,8 H16 M-16,20 H6" stroke="#999" stroke-width="3"/></g>
  <g id="p-doc-band"><use href="#p-doc"/><rect x="-26" y="-34" width="36" height="9" fill="#2c6fb7"/></g>
  <g id="p-coin"><circle r="13" fill="#ffe08a" stroke="#444" stroke-width="3"/><path d="M0,-6 V6" stroke="#444" stroke-width="3"/></g>
  <g id="p-coinx"><circle r="14" fill="#ffe08a" stroke="#444" stroke-width="3"/><path d="M0,-6 V6" stroke="#444" stroke-width="3"/><path d="M-21,21 L21,-21" stroke="#c0392b" stroke-width="5"/></g>
  <g id="p-loop"><path d="M-20,0 A20,20 0 1 1 0,20" fill="none" stroke="#2c6fb7" stroke-width="5"/><path d="M4,12 L-7,20 L4,28 Z" fill="#2c6fb7"/></g>
  <g id="p-lock"><rect x="-13" y="-2" width="26" height="22" rx="3" fill="#444"/><path d="M-7,-2 V-9 a7,7 0 0 1 14,0 V-2" fill="none" stroke="#444" stroke-width="4.5"/><circle cy="9" r="3" fill="white"/></g>
  <g id="p-share"><path d="M-16,0 H14 M5,-9 L14,0 L5,9" fill="none" stroke="#2e7d32" stroke-width="5"/></g>
  <g id="p-pencil"><g transform="rotate(35)"><rect x="-5" y="-18" width="10" height="28" fill="#f5b041" stroke="#444" stroke-width="2.5"/><path d="M-5,10 L0,22 L5,10 Z" fill="#f9e0b0" stroke="#444" stroke-width="2.5"/></g></g>
</defs>
<g class="zone" data-zone="cc-by">
  <rect x="20" y="20" width="270" height="250" rx="16" fill="#e6f2ff" stroke="#6b8fc7" stroke-width="3"/>
  <text class="ptitle" x="40" y="66">CC BY</text>
  <g transform="translate(60 110) scale(1.35)"><use href="#i-by"/></g>
  <g transform="translate(155 198) scale(1.35)"><use href="#p-doc" x="-60"/><use href="#p-share" x="22" y="-38"/><use href="#p-pencil" x="22" y="0"/><use href="#p-coin" x="22" y="40"/></g>
  <rect class="region" x="16" y="16" width="278" height="258" rx="19"/>
</g>
<g class="zone" data-zone="cc-by-sa">
  <rect x="315" y="20" width="270" height="250" rx="16" fill="#e8f7e6" stroke="#6aa86a" stroke-width="3"/>
  <text class="ptitle" x="335" y="66">CC BY-SA</text>
  <g transform="translate(355 110) scale(1.35)"><use href="#i-by"/></g>
  <g transform="translate(409 110) scale(1.35)"><use href="#i-sa"/></g>
  <g transform="translate(450 198) scale(1.1)"><use href="#p-doc-band" x="-82"/><use href="#p-loop" x="-4" y="-8"/><use href="#p-doc-band" x="74"/></g>
  <rect class="region" x="311" y="16" width="278" height="258" rx="19"/>
</g>
<g class="zone" data-zone="cc-by-nc">
  <rect x="610" y="20" width="270" height="250" rx="16" fill="#fff2dc" stroke="#d19a3e" stroke-width="3"/>
  <text class="ptitle" x="630" y="66">CC BY-NC</text>
  <g transform="translate(650 110) scale(1.35)"><use href="#i-by"/></g>
  <g transform="translate(704 110) scale(1.35)"><use href="#i-nc"/></g>
  <g transform="translate(745 198) scale(1.4)"><use href="#p-doc" x="-48"/><use href="#p-coinx" x="48" y="0"/></g>
  <rect class="region" x="606" y="16" width="278" height="258" rx="19"/>
</g>
<g class="zone" data-zone="cc-by-nc-sa">
  <rect x="20" y="290" width="270" height="250" rx="16" fill="#f1e8ff" stroke="#9068c8" stroke-width="3"/>
  <text class="ptitle" x="40" y="336">CC BY-NC-SA</text>
  <g transform="translate(60 380) scale(1.35)"><use href="#i-by"/></g>
  <g transform="translate(114 380) scale(1.35)"><use href="#i-nc"/></g>
  <g transform="translate(168 380) scale(1.35)"><use href="#i-sa"/></g>
  <g transform="translate(155 468) scale(1.0)"><use href="#p-doc-band" x="-92"/><use href="#p-loop" x="-14" y="-8"/><use href="#p-doc-band" x="58"/><use href="#p-coinx" x="102" y="-36"/></g>
  <rect class="region" x="16" y="286" width="278" height="258" rx="19"/>
</g>
<g class="zone" data-zone="cc-by-nd">
  <rect x="315" y="290" width="270" height="250" rx="16" fill="#dff6f6" stroke="#3a9ca0" stroke-width="3"/>
  <text class="ptitle" x="335" y="336">CC BY-ND</text>
  <g transform="translate(355 380) scale(1.35)"><use href="#i-by"/></g>
  <g transform="translate(409 380) scale(1.35)"><use href="#i-nd"/></g>
  <g transform="translate(450 468) scale(1.4)"><use href="#p-doc" x="-48"/><use href="#p-lock" x="48" y="-4"/></g>
  <rect class="region" x="311" y="286" width="278" height="258" rx="19"/>
</g>
<g class="zone" data-zone="cc-by-nc-nd">
  <rect x="610" y="290" width="270" height="250" rx="16" fill="#ffe4e4" stroke="#c76a6a" stroke-width="3"/>
  <text class="ptitle" x="630" y="336">CC BY-NC-ND</text>
  <g transform="translate(650 380) scale(1.35)"><use href="#i-by"/></g>
  <g transform="translate(704 380) scale(1.35)"><use href="#i-nc"/></g>
  <g transform="translate(758 380) scale(1.35)"><use href="#i-nd"/></g>
  <g transform="translate(745 468) scale(1.2)"><use href="#p-doc" x="-78"/><use href="#p-lock" x="8" y="-4"/><use href="#p-coinx" x="70" y="2"/></g>
  <rect class="region" x="606" y="286" width="278" height="258" rx="19"/>
</g>
</svg>
        </div>
        <section id="panel" aria-live="polite"></section>
        <div id="actions">
            <button id="btn-next" hidden>Next &rarr;</button>
            <button id="btn-again" hidden>Play again</button>
            <a href=".">Back to Lesson Plan</a>
        </div>
    </main>
    <script src="six-cc-licenses-poster.js"></script>
</body>
</html>
