<title>Following a Claim Back to Its Source</title>
<desc>A chain of four links from left to right, each a different object. Link 1: a page with a footnote mark, the resource&#x27;s footnote 4, which cites a textbook. Link 2: a closed textbook, which says wetlands filter pollutants and cites a review. A red stop flag stands on it, meaning a reviewer who stops here has only found that a textbook agrees. Link 3: a review article, which summarizes several studies of wetland filtering. Link 4: a laboratory bench with a flask and a gauge, one of those studies, which reports pollutant measurements before and after water passed through a wetland. It is the only link drawn as a place where something was measured, and it is the original source.</desc>
