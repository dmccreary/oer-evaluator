<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>Fork and Pull Request: Two Lanes, Seven Steps</title>
<desc>Two horizontal lanes. The top lane is the original repository and its maintainer. The bottom lane is your own copy. Seven numbered steps run from left to right. 1 Find the repository of the resource you want to improve, in the top lane. 2 Fork it to make your own copy: an arrow crosses down to a photocopied binder in the bottom lane. 3 Make your change in your copy and save it with a message. 4 Open a pull request, a sticky note on an arrow that crosses up to the top lane. 5 The maintainer reads the pull request and leaves comments. 6 You answer the comments with more changes in your copy. 7 The maintainer merges the pull request, shown as a rubber stamp. A faint dotted branch from step 5 ends in a cross, the declined pull request.</desc>
