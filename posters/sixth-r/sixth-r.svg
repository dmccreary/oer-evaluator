<text x="585" y="408" font-size="20" fill="#8a5a00" font-weight="bold" text-anchor="middle">the sixth R</text>
<text x="585" y="432" font-size="18" fill="#1b2a41" text-anchor="middle">(proposed)</text>
<rect x="720" y="104" width="440" height="496" rx="18" fill="#ffffff" stroke="#00796b" stroke-width="3"/>
<rect x="740" y="118" width="119.1" height="34" rx="17" fill="#004d40"/>
<text x="799.5" y="142.1" font-size="21" fill="#ffffff" font-weight="bold" text-anchor="middle">The book</text>
<text x="871.1" y="142" font-size="19" fill="#1b2a41">the output</text>
<polygon points="748,160 804.2,160 826,181.8 826,260 748,260" fill="#ffffff" stroke="#004d40" stroke-width="2.5" stroke-linejoin="round"/>
