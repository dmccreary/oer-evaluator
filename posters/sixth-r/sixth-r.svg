<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img">
<title>The Sixth R: Regenerate</title>
<desc>A picture that reads left to right. On the left, a panel titled The source, the means of production, holds three stacked cards: course description, which is where the book starts and from which agents build chapters, simulations, and quizzes; learning graph, a map of the concepts and what each depends on; and agentic skills, reusable documented steps an AI agent follows to build the book. In the middle, a thick arrow points from the source to the book and is labeled Regenerate, the sixth R, proposed. On the right, a panel titled The book, the output, shows a rendered page of chapters, MicroSims, and quizzes. Under it, five rows labeled Wiley&#x27;s 5Rs act here list Retain, Reuse, Revise, Remix, and Redistribute with their test questions, joined by small down arrows to show that each builds on the one before. A bar along the bottom reads: a license on the output alone gives you a copy, not the means of production; regenerate closes that gap.</desc>
<rect width="1200" height="700" fill="#f7f9fc"/>
<text x="40" y="50" font-size="32" fill="#1b2a41" font-weight="bold">The Sixth R: Regenerate</text>
<text x="40" y="80" font-size="18" fill="#4a5666">Wiley&#x27;s 5Rs cover the finished book. A proposed sixth R covers the source that builds it.</text>
