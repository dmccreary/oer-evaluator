<text x="211.1" y="142" font-size="19" fill="#1b2a41">the means of production</text>
<rect x="60" y="162" width="370" height="132" rx="14" fill="#ffffff" stroke="#c77700" stroke-width="3"/>
<circle cx="106" cy="228" r="33" fill="#fff6d6" stroke="#c77700" stroke-width="3"/>
