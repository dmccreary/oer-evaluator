<line x1="762" y1="233" x2="788.4" y2="233" stroke="#00796b" stroke-width="4" stroke-linecap="round"/>
<text x="848" y="192" font-size="19" fill="#1b2a41">The rendered site that readers</text>
<text x="848" y="216.3" font-size="19" fill="#1b2a41">see: chapters, MicroSims, and</text>
<text x="848" y="240.6" font-size="19" fill="#1b2a41">quizzes.</text>
<line x1="740" y1="308" x2="1140" y2="308" stroke="#c9d1db" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6"/>
<text x="740" y="336" font-size="21" fill="#004d40" font-weight="bold">Wiley&#x27;s 5Rs act here</text>
<rect x="740" y="350" width="150" height="38" rx="19" fill="#004d40"/>
<text x="815" y="375.5" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">Retain</text>
<text x="904" y="366" font-size="17" fill="#1b2a41">Can I make and keep my</text>
<text x="904" y="384.2" font-size="17" fill="#1b2a41">own copy?</text>
<polygon points="808,390 822,390 815,399" fill="#004d40" stroke-linejoin="round"/>
<rect x="740" y="400" width="150" height="38" rx="19" fill="#004d40"/>
<text x="815" y="425.5" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">Reuse</text>
<text x="904" y="425" font-size="17" fill="#1b2a41">Can I use it as it is?</text>
<polygon points="808,440 822,440 815,449" fill="#004d40" stroke-linejoin="round"/>
<rect x="740" y="450" width="150" height="38" rx="19" fill="#004d40"/>
<text x="815" y="475.5" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">Revise</text>
<text x="904" y="475" font-size="17" fill="#1b2a41">Can I change it?</text>
<polygon points="808,490 822,490 815,499" fill="#004d40" stroke-linejoin="round"/>
<rect x="740" y="500" width="150" height="38" rx="19" fill="#004d40"/>
<text x="815" y="525.5" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">Remix</text>
<text x="904" y="516" font-size="17" fill="#1b2a41">Can I combine it with other</text>
<text x="904" y="534.2" font-size="17" fill="#1b2a41">open work?</text>
<polygon points="808,540 822,540 815,549" fill="#004d40" stroke-linejoin="round"/>
<rect x="740" y="550" width="150" height="38" rx="19" fill="#004d40"/>
<text x="815" y="575.5" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">Redistribute</text>
<text x="904" y="566" font-size="17" fill="#1b2a41">Can I share copies with</text>
<text x="904" y="584.2" font-size="17" fill="#1b2a41">others?</text>
<rect x="40" y="612" width="1120" height="46" rx="12" fill="#ffffff" stroke="#c77700" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="600" y="642" font-size="18" fill="#1b2a41" font-weight="bold" text-anchor="middle">A license on the output alone gives you a copy, not the means of production. Regenerate closes that gap.</text>
<text x="40" y="686" font-size="15" fill="#4a5666">Regenerate is a proposal on the Intelligent Textbooks site, not part of Wiley&#x27;s 5Rs. The five test questions are from Chapter 1.</text>
</svg>
