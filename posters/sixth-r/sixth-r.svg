<text x="154" y="518" font-size="18" fill="#1b2a41">Reusable, documented steps</text>
<text x="154" y="540.5" font-size="18" fill="#1b2a41">an AI agent follows to build the</text>
<text x="154" y="563" font-size="18" fill="#1b2a41">book.</text>
