<line x1="106" y1="353" x2="123" y2="371" stroke="#8a5a00" stroke-width="2.5" stroke-linecap="round"/>
<line x1="89" y1="371" x2="97" y2="389" stroke="#8a5a00" stroke-width="2.5" stroke-linecap="round"/>
<line x1="123" y1="371" x2="115" y2="389" stroke="#8a5a00" stroke-width="2.5" stroke-linecap="round"/>
<line x1="89" y1="371" x2="123" y2="371" stroke="#8a5a00" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="106" cy="353" r="5.5" fill="#8a5a00"/>
<circle cx="89" cy="371" r="5.5" fill="#8a5a00"/>
<circle cx="123" cy="371" r="5.5" fill="#8a5a00"/>
<circle cx="97" cy="389" r="5.5" fill="#8a5a00"/>
<circle cx="115" cy="389" r="5.5" fill="#8a5a00"/>
<text x="154" y="346" font-size="24" fill="#8a5a00" font-weight="bold">Learning graph</text>
<text x="154" y="376" font-size="18" fill="#1b2a41">A map of the book&#x27;s concepts</text>
<text x="154" y="398.5" font-size="18" fill="#1b2a41">and what each one depends</text>
<text x="154" y="421" font-size="18" fill="#1b2a41">on.</text>
