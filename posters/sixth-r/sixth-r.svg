<text x="154" y="234" font-size="18" fill="#1b2a41">Where the book starts. Agents</text>
<text x="154" y="256.5" font-size="18" fill="#1b2a41">build chapters, simulations,</text>
<text x="154" y="279" font-size="18" fill="#1b2a41">and quizzes from it.</text>
<rect x="60" y="304" width="370" height="132" rx="14" fill="#ffffff" stroke="#c77700" stroke-width="3"/>
